# UnBox 分平台出包：Linux amd64 + arm64；Windows amd64 + arm64；macOS universal。
#
# Wails v3 桌面应用依赖平台原生工具链（Linux 的 GTK/WebKit、macOS 的
# WKWebView、Windows 的 WebView2 + syso），所以放弃 goreleaser，改用
# 「每个平台各自的 runner 原生编译」：Windows arm64 走纯 Go（CGO=0）交叉编译
# GOARCH=arm64；macOS 用 lipo 合成 arm64+amd64 通用二进制。
#
# Linux arm64 同样走原生 runner（ubuntu-24.04-arm，公开仓库免费可用），
# 与 linux-amd64 跑完全相同的步骤，不走 wails-cross：交叉编译依赖
# wails-cross Docker 镜像，而 stock build.sh 构建的是仓库根目录 `.`
# （cmd/unbox 才是 main）——`go build -o X .` 退出码 0 却只产出一个
# 几十 KB 的 ar 归档，deb 里没有可执行文件。原生 ARM runner 上
# TARGET_ARCH（env ARCH=arm64）与宿主架构一致，stock Taskfile 直接走
# build:native；nfpm 的 `arch: ${GOARCH}` 由打包步骤内 export 的
# GOARCH=arm64 驱动；AppImage 也由 wails3 生成器原生打出 aarch64 版。
# 产物名与 amd64 区分开（deb 叫 linux-arm64、AppImage 叫 aarch64、
# 许可证包带 linux-arm64 后缀，避免 Release 挂同名附件冲突）。
#
# 触发方式：
#   - 推送 v* 标签（如 v0.1.0）→ 构建并自动创建 GitHub Release 挂载产物
#   - 手动 workflow_dispatch → 仅构建并上传产物（不建 Release）
#
# 产物：
#   - Linux   UnBox-<ver>-linux-amd64.deb / UnBox-<ver>-x86_64.AppImage / -licenses.tar.gz
#             UnBox-<ver>-linux-arm64.deb / UnBox-<ver>-aarch64.AppImage / -linux-arm64-licenses.tar.gz
#   - Windows UnBox-<ver>-windows-amd64/arm64-installer.exe / -amd64.exe / -arm64.exe
#             / -<arch>-licenses.tar.gz（便携 exe 无法内嵌，随 Release 提供）
#   - macOS   UnBox-<ver>-macos-universal.zip（内含 .app，arm64 + amd64 通用二进制）

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            arch: arm64
          - os: windows-latest
            name: windows-amd64
            arch: amd64
          - os: windows-latest
            name: windows-arm64
            arch: arm64
          - os: macos-latest
            name: macos-universal
            # 不设 arch：universal 内部按 task var 各编 amd64/arm64 再 lipo
    runs-on: ${{ matrix.os }}
    # ARCH 驱动 stock Taskfile 里所有 {{.ARCH}}（syso 架构、NSIS ARG_FLAG、
    # 单 arch build 的 GOARCH）；universal 路径里 build:universal 用显式
    # task var（ARCH=amd64/arm64）覆盖 env，故 macOS 此处 ARCH 为空也无碍。
    #
    # GOARCH 绝不在 job 级设置——两个坑都因它而起：
    #   1) arm64 任务里 `go install wails3` 会交叉编译，二进制落进
    #      $GOPATH/bin/<GOOS>_<GOARCH>/ 子目录，而 setup-go 只把 $GOPATH/bin
    #      加进 PATH → wails3: command not found。
    #   2) macOS universal：matrix.arch 为空 → job 级 GOARCH=""（空串但已
    #      设置）。go-task 里 shell env 优先级高于 Task env:，build:native
    #      的 `env: GOARCH: '{{.ARCH | default ARCH}}'`（应解为 amd64/arm64）
    #      被空串覆盖，两次 go build 都退回宿主架构（macos-latest=arm64）
    #      → lipo 报 "same architectures (arm64)"。去掉 job 级 GOARCH 后
    #      Task env 才生效，两架构才分得开。
    # Linux generate:deb 仍需 shell GOARCH 供 nfpm.yaml `arch: ${GOARCH}` 读取，
    # 故在各 Linux 打包步骤内 export GOARCH="${ARCH}"（此时 wails3 已装好，
    # 不会触发坑 1；值与 Task env 一致，不触发坑 2）。
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.1" >> "$GITHUB_ENV"
          fi

      - name: Sync donors snapshot
        run: |
          # go:embed 不能跨包目录引用 docs/，发版前把最新榜单拷成内置快照，
          # 否则离线/拉取失败的用户看到的是空列表而不是发版时的真实榜单。
          cp docs/donors.json internal/shell/donors_snapshot.json
          echo "内置快照已同步: $(wc -c < internal/shell/donors_snapshot.json) 字节"

      - name: Package Linux (deb + AppImage)
        if: runner.os == 'Linux'
        run: |
          export GOARCH="${ARCH}"   # nfpm.yaml `arch: ${GOARCH}` 读宿主 env
          wails3 task linux:create:deb
          wails3 task linux:create:appimage
          V="${GITHUB_REF_NAME#v}"
          # 产物名按架构区分（arm64：deb 叫 linux-arm64、AppImage 叫 aarch64，
          # 许可证包带 linux-arm64 后缀——与 amd64 的同名包区分开，避免
          # Release 挂同名附件冲突；release job 本就按 artifact 全量收集，
          # 新矩阵条目无需另改）。
          # AppImage 目录规范：文件名不带 linux（AppImage 天然是 Linux 的），
          # 用 App-1.0-x86_64/aarch64.AppImage 形式。deb 保留 linux-<arch>。
          if [[ "${ARCH}" == "arm64" ]]; then
            mv bin/*.deb       "UnBox-${V}-linux-arm64.deb"
            mv bin/*.AppImage  "UnBox-${V}-aarch64.AppImage"
            mv bin/UnBox-licenses.tar.gz "UnBox-${V}-linux-arm64-licenses.tar.gz"
          else
            mv bin/*.deb       "UnBox-${V}-linux-amd64.deb"
            mv bin/*.AppImage  "UnBox-${V}-x86_64.AppImage"
            # AppImage 是单文件格式，无法内嵌许可证；随发布产物提供同一组文件。
            mv bin/UnBox-licenses.tar.gz "UnBox-${V}-licenses.tar.gz"
          fi
          ls -la

      - name: Package Windows (NSIS installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          # choco 只把 NSIS 目录写进机器 PATH（新 shell 才生效），当前 step 需手动加
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          wails3 task windows:package
          V="${GITHUB_REF_NAME#v}"
          # NSIS OutFile = unbox-<arch>-installer.exe（ARG_FLAG → AMD64/ARM64），
          # 便携 exe = bin/unbox.exe（build:native 输出不带架构后缀，每矩阵条目
          # 独立 runner 无冲突）。
          mv bin/*-installer.exe "UnBox-${V}-windows-${ARCH}-installer.exe"
          mv bin/unbox.exe       "UnBox-${V}-windows-${ARCH}.exe"
          # 便携 exe 是单文件，装不进许可证；与 AppImage 同策略，随 Release
          # 提供同一组文件，避免只下载便携版时缺少 MIT/BSD/ISC 声明。
          # 注意：输出路径不能带 Windows 盘符（D:\…），GNU tar 会把 "D:" 当成
          # rsh 远程主机解析；用相对路径写到仓库根，正好命中上传 glob UnBox-*。
          (cd internal/crawler/assets && tar -czf \
            "../../UnBox-${V}-windows-${ARCH}-licenses.tar.gz" \
            THIRD-PARTY-NOTICES.txt LICENSE.cheerio.txt \
            LICENSE.bundled-deps.txt LICENSE.crypto-js.txt)
          ls -la

      - name: Package macOS (universal .app → zip)
        if: runner.os == 'macOS'
        run: |
          # darwin:package:universal 先按 amd64/arm64 各编一次，再用 lipo 合成
          # 通用二进制（Apple Silicon 与 Intel 通吃），无需 Intel runner。
          wails3 task darwin:package:universal
          V="${GITHUB_REF_NAME#v}"
          (cd bin && zip -qr "../UnBox-${V}-macos-universal.zip" unbox.app)
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: UnBox-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
