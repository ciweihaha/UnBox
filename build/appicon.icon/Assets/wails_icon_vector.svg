<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- UnBox 新图标（第 12 项）：红底圆角方盒 + 白色播放三角。简洁现代，
       16px 下仍可辨；红取应用主色 #e50914 一系。 -->
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8262F"/>
      <stop offset="1" stop-color="#C50812"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#box)"/>
  <!-- 播放三角：描边与填充同色、round 连接，三个角都是圆角。 -->
  <path id="play" d="M 416 300 L 716 512 L 416 724 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="48" stroke-linejoin="round"/>
</svg>
